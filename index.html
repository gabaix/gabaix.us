<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gabaix.us</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>gabaix.us</h1>

    <div class="section">
        <h2>Pages</h2>
        <ul>
            <li><a href="/cookies/">Cookie Demo</a></li>
            <li><a href="https://chess.gabaix.us">Chess Opening Repertoire</a></li>
            <li><a href="https://timetracker.gabaix.us">Time Tracker</a></li>
            <li><a href="https://todos.gabaix.us">Todos</a></li>
            <li><a href="https://memecapital.lol">Meme Capital</a></li>
        </ul>
        <p><small>Last deployed: <span id="deploy-time">loading...</span></small></p>
    </div>
    <script>
        fetch('https://api.github.com/repos/gabaix/gabaix.us/commits/master')
            .then(r => r.json())
            .then(data => {
                const date = new Date(data.commit.committer.date);
                document.getElementById('deploy-time').textContent = date.toLocaleString('en-US', { month: 'long', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
            })
            .catch(() => {
                document.getElementById('deploy-time').textContent = 'unavailable';
            });
    </script>
</body>
</html>
